<!DOCTYPE html>
<html lang="ja">
<head>
  <title>PDF作成・ダウンロード - 小平市防災タウンマップ</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" crossorigin="anonymous" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #faf7ee;
      background-image: radial-gradient(#ede6d6 1.2px, transparent 1.2px), linear-gradient(135deg, #fdfbf7 0%, #f6f1e5 100%);
      background-size: 24px 24px, 100% 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", Meiryo, sans-serif;
      color: #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #ede7db;
      border-radius: 22px;
      width: 100%;
      max-width: 440px;
      padding: 34px 26px 30px;
      box-shadow: 0 16px 36px rgba(180, 160, 130, 0.14), 0 2px 8px rgba(0, 0, 0, 0.04);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .app-icon {
      width: 62px;
      height: 62px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.25);
    }

    .app-icon svg {
      width: 34px;
      height: 34px;
      fill: #ffffff;
    }

    h1 {
      font-size: 21px;
      font-weight: 700;
      color: #2d3748;
      letter-spacing: 0.02em;
      margin-bottom: 22px;
    }

    .status-container {
      width: 100%;
      background: #fbf9f4;
      border: 1px solid #ede7db;
      border-radius: 16px;
      padding: 22px 18px;
      margin-bottom: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #ede7db;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 14px;
    }

    .spinner.done {
      border-color: #22c55e;
      border-top-color: #22c55e;
      animation: none;
      position: relative;
    }

    .spinner.done::after {
      content: '✓';
      font-size: 24px;
      color: #16a34a;
      font-weight: bold;
      line-height: 36px;
    }

    .spinner.error {
      border-color: #ef4444;
      border-top-color: #ef4444;
      animation: none;
    }

    .spinner.error::after {
      content: '✕';
      font-size: 22px;
      color: #dc2626;
      font-weight: bold;
      line-height: 36px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-text {
      font-size: 15px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 4px;
      min-height: 22px;
    }

    .status-desc {
      font-size: 12px;
      color: #78716c;
      min-height: 16px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #ede7db;
      border-radius: 3px;
      margin-top: 14px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 15%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      width: 100%;
      padding: 13px 16px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      border: none;
      box-sizing: border-box;
    }

    .btn-primary {
      background: #2563eb;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }

    .btn-primary:hover:not(:disabled) {
      background: #1d4ed8;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:disabled {
      background: #cbd5e1;
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
    }

    .btn-secondary {
      background: #334155;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(51, 65, 85, 0.15);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #1e293b;
      transform: translateY(-1px);
    }

    .btn-secondary:disabled {
      background: #f5f2eb;
      color: #a8a29e;
      border: 1px solid #e7e2d6;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .meta-box {
      margin-top: 20px;
      font-size: 11px;
      color: #a8a29e;
      line-height: 1.5;
    }

    .meta-box span {
      color: #57534e;
      font-weight: 600;
    }

    /* Offscreen container for MapLibre rendering */
    #hidden-container {
      position: fixed;
      left: -99999px;
      top: 0;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="app-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/>
      </svg>
    </div>

    <h1>小平市防災タウンマップ</h1>

    <div class="status-container">
      <div class="spinner" id="spinner"></div>
      <div class="status-text" id="status-text">地図データを準備中...</div>
      <div class="status-desc" id="status-desc">高解像度タイルを読み込んでいます</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <div class="actions">
      <button id="close-btn" class="btn btn-secondary" onclick="closePage()" disabled>
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
          <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"/>
        </svg>
        ページを閉じる
      </button>

      <a id="download-link" class="btn btn-primary" href="#" style="display:none;" download="小平市防災タウンマップ.pdf">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
          <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5z"/>
          <path d="M7.646 11.854a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293V1.5a.5.5 0 0 0-1 0v8.793L5.354 8.146a.5.1 0 1 0-.708.708l3 3z"/>
        </svg>
        PDFを保存 / 再ダウンロード
      </a>
    </div>

    <div class="meta-box" id="meta-info">
      用紙: <span>A3横 (420×297mm)</span> / 解像度: <span>300 DPI</span>
    </div>
  </div>

  <div id="hidden-container"></div>
  <div id="hidden-qr" style="display:none;"></div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const targetLat = parseFloat(urlParams.get('lat')) || 35.73489;
    const targetLng = parseFloat(urlParams.get('lng')) || 139.47766;
    const targetZoom = parseFloat(urlParams.get('zoom')) || 15.5;
    const targetBearing = parseFloat(urlParams.get('bearing')) || 0;
    const targetPitch = parseFloat(urlParams.get('pitch')) || 0;
    const isMapQREnabled = urlParams.get('qr') === '1' || urlParams.get('qr') === 'true';

    function closePage() {
      window.close();
      setTimeout(() => {
        alert('ブラウザのタブまたはアプリの「✕」ボタンから画面を閉じてください。');
      }, 300);
    }

    const spinner = document.getElementById('spinner');
    const statusText = document.getElementById('status-text');
    const statusDesc = document.getElementById('status-desc');
    const progressBar = document.getElementById('progress-bar');
    const downloadLink = document.getElementById('download-link');

    function updateStatus(text, desc, progress, state = 'running') {
      if (statusText) statusText.textContent = text;
      if (statusDesc) {
        statusDesc.textContent = desc || '';
        statusDesc.style.display = desc ? 'block' : 'none';
      }
      if (progressBar) progressBar.style.width = `${progress}%`;
      if (state === 'done') {
        spinner.className = 'spinner done';
      } else if (state === 'error') {
        spinner.className = 'spinner error';
      }
    }

    // Helper: Ground scale calculation (Mercator)
    function calculateScale(lat, zoom) {
      const latRad = lat * Math.PI / 180;
      const metersPerPixel = (156543.03392 * Math.cos(latRad)) / Math.pow(2, zoom);
      const maxWidth = 100; // CSS px at 96 DPI
      const maxMeters = maxWidth * metersPerPixel;

      const niceNumbers = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000];
      let chosenMeters = niceNumbers[0];
      for (const n of niceNumbers) {
        if (n <= maxMeters) {
          chosenMeters = n;
        } else {
          break;
        }
      }

      const cssWidth = chosenMeters / metersPerPixel;
      const scaleW = Math.round(cssWidth * (300 / 96));
      const scaleText = chosenMeters < 1000 ? `${chosenMeters} m` : `${chosenMeters / 1000} km`;
      return { scaleW, scaleText };
    }

    // Load an image asynchronously
    function loadImage(src) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    async function generateAndDownloadPDF() {
      let exportMap = null;
      let hiddenContainer = document.getElementById('hidden-container');

      try {
        updateStatus('画像リソースを準備中...', 'タイトル・凡例画像をロードしています', 20);
        const [titleImg, legendImg] = await Promise.all([
          loadImage('./img/title.png'),
          loadImage('./img/legend.png')
        ]);

        updateStatus('高解像度タイルを取得中...', '+1段階ズームの高精細地図を描画しています', 40);

        // Dimensions of inner map content
        const baseW = 1550; // 410mm at 96 DPI
        const baseH = 1085; // 287mm at 96 DPI
        const renderZoom = Math.min(targetZoom + 1, 19);
        const zoomDelta = renderZoom - targetZoom;
        const scaleMult = Math.pow(2, zoomDelta);

        const exportW = Math.round(baseW * scaleMult);
        const exportH = Math.round(baseH * scaleMult);

        hiddenContainer.style.width = `${exportW}px`;
        hiddenContainer.style.height = `${exportH}px`;

        exportMap = new maplibregl.Map({
          container: hiddenContainer,
          preserveDrawingBuffer: true,
          center: [targetLng, targetLat],
          zoom: renderZoom,
          bearing: targetBearing,
          pitch: targetPitch,
          style: {
            version: 8,
            sources: {
              'custom-tiles': {
                type: 'raster',
                tiles: ['./tiles/{z}/{x}/{y}.png'],
                tileSize: 256,
                minzoom: 13,
                maxzoom: 19,
                attribution: 'MapData : OpenStreetMap'
              }
            },
            layers: [
              {
                id: 'custom-tiles-layer',
                type: 'raster',
                source: 'custom-tiles',
                minzoom: 13,
                maxzoom: 19
              }
            ]
          }
        });

        // Wait for tiles to finish loading
        await Promise.race([
          new Promise(resolve => exportMap.once('idle', resolve)),
          new Promise(resolve => setTimeout(resolve, 8000))
        ]);

        updateStatus('300dpi PDFを合成中...', 'A3用紙サイズに高精細レンダリングを行っています', 75);

        // 300 DPI Canvas (A3 Landscape: 420mm x 297mm)
        const dpmm = 300 / 25.4; // 11.811 px/mm
        const canvasW = Math.round(420 * dpmm); // 4961 px
        const canvasH = Math.round(297 * dpmm); // 3508 px

        const canvas = document.createElement('canvas');
        canvas.width = canvasW;
        canvas.height = canvasH;
        const ctx = canvas.getContext('2d');

        // 1. Draw Page Background (White)
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvasW, canvasH);

        // 2. 5mm Margins and Inner Content Dimensions
        const margin = Math.round(5 * dpmm); // 59 px
        const marginPx = margin;
        const contentX = marginPx;
        const contentY = marginPx;
        const contentW = canvasW - (marginPx * 2); // 4843 px (410mm)
        const contentH = canvasH - (marginPx * 2); // 3390 px (287mm)

        // 3. Draw Map from Offscreen Canvas
        const mapCanvas = exportMap.getCanvas();
        ctx.drawImage(mapCanvas, 0, 0, mapCanvas.width, mapCanvas.height, contentX, contentY, contentW, contentH);

        // 4. Draw Inner Content Border
        ctx.strokeStyle = '#cccccc';
        ctx.lineWidth = 2;
        ctx.strokeRect(contentX, contentY, contentW, contentH);

        // 5. Draw Title Image (top: 3mm, left: 3mm, width: 10cm = 100mm)
        if (titleImg) {
          const titleW = Math.round(100 * dpmm); // 1181 px
          const titleH = titleW * (titleImg.naturalHeight / titleImg.naturalWidth);
          const titlePad = Math.round(3 * dpmm);
          const titleX = contentX + titlePad;
          const titleY = contentY + titlePad;

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
          ctx.shadowBlur = 24;
          ctx.shadowOffsetY = 8;
          ctx.drawImage(titleImg, titleX, titleY, titleW, titleH);
          ctx.restore();
        }

        // 6. Draw Compass (top: 8mm, right: 8mm)
        const compassR = Math.round(32 * (300 / 96)); // ~100px radius
        const compassPad = Math.round(8 * dpmm);
        const compassCenterX = contentX + contentW - compassPad - compassR;
        const compassCenterY = contentY + compassPad + compassR;

        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = 8;
        ctx.beginPath();
        ctx.arc(compassCenterX, compassCenterY, compassR, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#cbd5e1';
        ctx.stroke();
        ctx.restore();

        // Rotate needle with map bearing
        ctx.save();
        ctx.translate(compassCenterX, compassCenterY);
        const bearingRad = (-targetBearing) * Math.PI / 180;
        ctx.rotate(bearingRad);

        const arrowH = compassR * 0.72;
        const arrowW = compassR * 0.25;

        // North arrow (Red)
        ctx.beginPath();
        ctx.moveTo(0, -arrowH);
        ctx.lineTo(arrowW, 0);
        ctx.lineTo(0, -arrowH * 0.2);
        ctx.lineTo(-arrowW, 0);
        ctx.closePath();
        ctx.fillStyle = '#dc2626';
        ctx.fill();

        // South arrow (Silver)
        ctx.beginPath();
        ctx.moveTo(0, arrowH);
        ctx.lineTo(arrowW, 0);
        ctx.lineTo(0, arrowH * 0.2);
        ctx.lineTo(-arrowW, 0);
        ctx.closePath();
        ctx.fillStyle = '#94a3b8';
        ctx.fill();

        // Center hub
        ctx.beginPath();
        ctx.arc(0, 0, compassR * 0.12, 0, Math.PI * 2);
        ctx.fillStyle = '#1e293b';
        ctx.fill();

        // "N" Mark (Large bold red)
        ctx.font = `900 ${Math.round(compassR * 0.4)}px Arial, sans-serif`;
        ctx.fillStyle = '#dc2626';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText('N', 0, -arrowH - 4);
        ctx.restore();

        // 7. Draw Scale Bar (bottom: 8mm, left: 8mm)
        const { scaleW, scaleText } = calculateScale(targetLat, targetZoom);
        const scalePad = Math.round(8 * dpmm);
        const scaleX = contentX + scalePad;
        const scaleY = contentY + contentH - scalePad - 30;

        ctx.save();
        ctx.strokeStyle = '#333333';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(scaleX, scaleY - 14);
        ctx.lineTo(scaleX, scaleY);
        ctx.lineTo(scaleX + scaleW, scaleY);
        ctx.lineTo(scaleX + scaleW, scaleY - 14);
        ctx.stroke();

        ctx.font = 'bold 24px Arial, sans-serif';
        ctx.fillStyle = '#111111';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        ctx.fillText(scaleText, scaleX + scaleW / 2, scaleY - 4);
        ctx.restore();

        // 8. Draw Legend + Notice Box + Credit (bottom: 2mm, right: 3mm, width: 6cm = 60mm)
        const legendW = Math.round(60 * dpmm); // 709 px (6cm)
        const legendPadRight = Math.round(3 * dpmm); // 3mm from right
        const legendPadBottom = Math.round(2 * dpmm); // 2mm from bottom (moved down)
        const legendX = contentX + contentW - legendPadRight - legendW;

        const legendH = (legendImg && legendImg.naturalWidth > 0)
          ? legendW * (legendImg.naturalHeight / legendImg.naturalWidth)
          : Math.round(legendW * 0.4);

        const noticeLines = [
          '※災害対策用井戸',
          '　災害時に限り、井戸所有者のご協力により生活用水としての',
          '　井戸水を近隣の方々へ提供していただけるもの。',
          '詳しくは小平市のホームページをご確認ください。'
        ];
        const noticeFontSize = 21;
        const noticeLineHeight = 30;
        const noticePadY = 14;
        const noticePadX = 20;
        const noticeH = noticePadY * 2 + noticeLines.length * noticeLineHeight;

        // Credit formatting (3 lines, 3pt font size, no datetime)
        const creditLines = [
          '©OpenStreetMap contributors (ODbL)  ; MapLibre ; 地図作製：高橋克典(こだいらSVCS)',
          '参考・出典：小平市防災マップ ; 東京消防庁オープンデータ ; 国土交通省位置参照情報ダウンロードサービス',
          'NPO法人小平井戸の会様の情報も参考にさせていただきました'
        ];
        const creditFontSize = 13; // 3pt at 300 DPI (300/72 * 3 = 12.5px -> 13px)
        const creditLineHeight = 17;
        const creditPadY = 4;
        const creditPadX = 8;
        const creditH = creditPadY * 2 + creditLines.length * creditLineHeight; // 59 px (~5mm)
        const gap = 6;

        ctx.font = `${creditFontSize}px Arial, sans-serif`;
        let maxCreditTextW = 0;
        for (let i = 0; i < creditLines.length; i++) {
          const w = ctx.measureText(creditLines[i]).width;
          if (w > maxCreditTextW) maxCreditTextW = w;
        }
        const creditW = Math.max(legendW, Math.round(maxCreditTextW + creditPadX * 2));
        const creditX = legendX + legendW - creditW;

        const legendY = contentY + contentH - legendPadBottom - (legendH + gap + noticeH + gap + creditH);

        // Draw "凡例" label (8pt) at top-left of legend image with 3mm left/right padding
        ctx.save();
        ctx.font = 'bold 33px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
        const badgeMetrics = ctx.measureText('凡例');
        const badgePadX = Math.round(3 * dpmm); // 3mm on left and right
        const badgePadY = 6;
        const titleBadgeW = Math.round(badgeMetrics.width + badgePadX * 2);
        const titleBadgeH = Math.round(8 * (300 / 72) + badgePadY * 2);
        const titleBadgeY = legendY - titleBadgeH - 4;

        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.fillRect(legendX, titleBadgeY, titleBadgeW, titleBadgeH);
        ctx.fillStyle = '#111111';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('凡例', legendX + titleBadgeW / 2, titleBadgeY + titleBadgeH / 2);
        ctx.restore();

        // Draw 2cm x 2cm QR Code on map if enabled
        if (isMapQREnabled) {
          const qrSize = Math.round(20 * dpmm); // 236 px (2cm)
          const qrGap = 12;
          const qrX = legendX + legendW - qrSize;
          const qrY = legendY - qrSize - qrGap;

          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.25)';
          ctx.shadowBlur = 12;
          ctx.shadowOffsetY = 4;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(qrX, qrY, qrSize, qrSize);
          ctx.strokeStyle = '#cbd5e1';
          ctx.lineWidth = 2;
          ctx.strokeRect(qrX, qrY, qrSize, qrSize);

          // Generate QR code offscreen
          const qrContainer = document.getElementById('hidden-qr');
          qrContainer.innerHTML = '';
          const downloadUrl = window.location.href;
          new QRCode(qrContainer, {
            text: downloadUrl,
            width: 180,
            height: 180,
            colorDark: '#0f172a',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.M
          });

          const qrCanvas = qrContainer.querySelector('canvas') || qrContainer.querySelector('img');
          if (qrCanvas) {
            ctx.drawImage(qrCanvas, qrX + 10, qrY + 10, qrSize - 20, qrSize - 30);
          }

          ctx.font = 'bold 16px sans-serif';
          ctx.fillStyle = '#334155';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText('PDF取得', qrX + qrSize / 2, qrY + qrSize - 4);
          ctx.restore();
        }

        // Draw Legend Image
        if (legendImg && legendImg.naturalWidth > 0) {
          ctx.save();
          ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
          ctx.shadowBlur = 18;
          ctx.shadowOffsetY = 6;
          ctx.drawImage(legendImg, legendX, legendY, legendW, legendH);
          ctx.restore();
        }

        // Draw Notice Box
        const noticeY = legendY + legendH + gap;
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 5;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(legendX, noticeY, legendW, noticeH);
        ctx.strokeStyle = '#cccccc';
        ctx.lineWidth = 2;
        ctx.strokeRect(legendX, noticeY, legendW, noticeH);

        ctx.font = `${noticeFontSize}px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif`;
        ctx.fillStyle = '#111111';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        for (let i = 0; i < noticeLines.length; i++) {
          ctx.fillText(noticeLines[i], legendX + noticePadX, noticeY + noticePadY + i * noticeLineHeight);
        }
        ctx.restore();

        // Draw Credit Box (3 lines, extending to left as needed)
        const creditY = noticeY + noticeH + gap;
        ctx.save();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
        ctx.fillRect(creditX, creditY, creditW, creditH);
        ctx.font = `${creditFontSize}px Arial, sans-serif`;
        ctx.fillStyle = '#333333';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (let i = 0; i < creditLines.length; i++) {
          const lineY = creditY + creditPadY + i * creditLineHeight + creditLineHeight / 2;
          ctx.fillText(creditLines[i], creditX + creditW - creditPadX, lineY);
        }
        ctx.restore();

        // 7. Draw Disclaimer in bottom-right margin (6pt)
        const disclaimerText = '本マップは2026年8月時点の情報をもとに個人／団体が自主作成したものです。避難所や設備の最新情報・正確な運用状況については小平市・東京消防庁・国土交通省等各種公式情報をご確認ください。';
        const disclaimerFontSize = Math.round(6 * (300 / 72)); // 25 px (6pt)
        const disclaimerX = contentX + contentW - legendPadRight;
        const disclaimerY = contentY + contentH + Math.round(margin / 2);

        ctx.save();
        ctx.font = `${disclaimerFontSize}px -apple-system, BlinkMacSystemFont, "Yu Gothic UI", "BIZ UDPGothic", Meiryo, sans-serif`;
        ctx.fillStyle = '#333333';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.fillText(disclaimerText, disclaimerX, disclaimerY);
        ctx.restore();

        // Convert to jsPDF
        updateStatus('PDFをダウンロード中...', '端末へファイルを送信しています', 95);

        const imgData = canvas.toDataURL('image/jpeg', 0.95);
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: 'landscape',
          unit: 'mm',
          format: 'a3'
        });

        pdf.addImage(imgData, 'JPEG', 0, 0, 420, 297);

        // Generate Blob for direct download link & mobile Safari compatibility
        const pdfBlob = pdf.output('blob');
        const pdfUrl = URL.createObjectURL(pdfBlob);

        // Update download button
        downloadLink.href = pdfUrl;
        downloadLink.style.display = 'inline-flex';

        // Trigger automatic download
        pdf.save('小平市防災タウンマップ.pdf');

        const closeBtn = document.getElementById('close-btn');
        if (closeBtn) closeBtn.disabled = false;

        updateStatus('ダウンロードを開始しました！', '', 100, 'done');
      } catch (err) {
        console.error(err);
        const closeBtn = document.getElementById('close-btn');
        if (closeBtn) closeBtn.disabled = false;
        updateStatus('PDF作成中にエラーが発生しました', err.message, 100, 'error');
      } finally {
        if (exportMap) {
          try { exportMap.remove(); } catch(e) {}
        }
      }
    }

    // Start PDF creation automatically when page loads
    window.addEventListener('load', () => {
      setTimeout(generateAndDownloadPDF, 400);
    });
  </script>
</body>
</html>
