<!DOCTYPE html>
<html lang="ja">
<head>
  <title>小平市防災タウンマップ2026年8月版</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }
    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'custom-tiles': {
            type: 'raster',
            tiles: ['./tiles/{z}/{x}/{y}.png'],
            tileSize: 256,
            minzoom: 13,
            maxzoom: 19,
            attribution: 'MapData : OpenStreetMap'
          }
        },
        layers: [
          {
            id: 'custom-tiles-layer',
            type: 'raster',
            source: 'custom-tiles',
            minzoom: 13,
            maxzoom: 19
          }
        ]
      },
      center: [139.475, 35.726],
      zoom: 16
    });

    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
