<!DOCTYPE html>
<html lang="ja">
<head>
  <title>小平市防災タウンマップ2026年8月版</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .title-banner {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      max-width: min(500px, calc(100% - 60px));
      pointer-events: none;
      filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.35));
    }
    .title-banner img {
      max-width: 100%;
      height: auto;
      display: block;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="title-banner">
    <img src="./img/title.png" alt="小平市防災タウンマップ2026年8月版" />
  </div>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      minZoom: 13,
      maxZoom: 18,
      style: {
        version: 8,
        sources: {
          'custom-tiles': {
            type: 'raster',
            tiles: ['./tiles/{z}/{x}/{y}.png'],
            tileSize: 256,
            minzoom: 13,
            maxzoom: 18,
            attribution: 'MapData : OpenStreetMap'
          }
        },
        layers: [
          {
            id: 'custom-tiles-layer',
            type: 'raster',
            source: 'custom-tiles',
            minzoom: 13
          }
        ]
      },
      center: [139.475, 35.726],
      zoom: 16
    });

    // ズーム・コンパス（方位）コントローラー
    map.addControl(new maplibregl.NavigationControl({
      showCompass: true,
      showZoom: true,
      visualizePitch: true
    }), 'top-right');

    // スケール（縮尺）コントローラー
    map.addControl(new maplibregl.ScaleControl({
      maxWidth: 120,
      unit: 'metric'
    }), 'bottom-left');

    // 現在地表示コントローラー
    const geolocate = new maplibregl.GeolocateControl({
      positionOptions: {
        enableHighAccuracy: true
      },
      trackUserLocation: true,
      showUserLocation: true
    });
    map.addControl(geolocate, 'top-right');
  </script>
</body>
</html>
